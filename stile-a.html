<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoe stile A</title>
<style>
body{font-family:-apple-system,Arial,sans-serif;margin:0 auto;max-width:430px;background:#FBF3E4;color:#161616;padding:18px;padding-bottom:30px;overflow-x:hidden}
.blob{position:absolute;top:-30px;right:-30px;width:140px;height:140px;background:#8FA66B;border-radius:50% 40% 55% 45%;z-index:0}
h1{font-size:44px;line-height:1;margin:34px 0 4px;position:relative}
h1 i{font-weight:400}
.sub{font-size:16px;margin-bottom:16px;position:relative}
.crisi{background:#000;border-radius:28px;padding:14px;margin-bottom:22px;position:relative}
.crisi button{display:block;width:100%;border:0;border-radius:20px;font-size:24px;font-weight:800;padding:30px 6px;margin-bottom:10px}
.crisi .st{background:#3DDC84;color:#000}.crisi .sp{background:#FF5252;color:#000;margin-bottom:0}
.f{border-radius:26px;padding:18px;margin-bottom:14px;position:relative}
.f b{font-size:26px;display:block}
.f span{font-size:15px}
.tondo{background:#C3D0F0;border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.q1{background:#F7E27A;transform:rotate(-2deg)}
.q2{background:#F1B9D9;transform:rotate(1.5deg)}
.q3{background:#C3D0F0;transform:rotate(-1deg)}
.q4{background:#CBE3B8;transform:rotate(2deg)}
.bt{display:inline-block;background:#000;color:#fff;border-radius:30px;padding:14px 26px;font-size:17px;margin-top:6px}
</style></head><body>
<div class="blob"></div>
<h1>Zoe,<br><i>oggi</i></h1>
<div class="sub">Un tocco per segnare, il resto dopo.</div>
<div class="crisi"><button class="st">&#9654; START CRISI</button><button class="sp">&#9632; STOP CRISI</button></div>
<div class="f q1"><b>Attacchi</b><span>Ultimo oggi 07:42, 1 min 20 s &middot; 3 questo mese</span></div>
<div class="f q2"><b>Urina</b><span>Oggi 2 volte &middot; ultima 09:10</span></div>
<div class="f q3"><b>Medicine</b><span>4 su 4 in orario &middot; prossima 20:00</span></div>
<div class="f q4"><b>Peso</b><span>32 kg &middot; clinica, 4 novembre</span></div>
<div class="f tondo"><b>Ecografia</b><span>lunedì 9 novembre</span><br><span class="bt">Apri cartella &rarr;</span></div>
</body></html>
